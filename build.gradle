buildscript {
    repositories {

        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {

    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {

        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {

            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {

            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        url "https://cursemaven.com"
            content {
                includeGroup "curse.maven"
            }
    }
    maven {
        url "https://maven.firstdarkdev.xyz/snapshots"
    }
    maven {
        url "https://maven.shadowsoffire.dev/releases"
        content {
            includeGroup "dev.shadowsoffire"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        forRepositories(fg.repository)
        filter {
            includeGroup "maven.modrinth"
        }
    }

    maven {
        url "https://maven.blamejared.com"
    }

    maven {
        url "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }

}

dependencies {

    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("curse.maven:curios-309927:5367944")
    implementation fg.deobf("curse.maven:JEI-238222:6075247")
    implementation fg.deobf("maven.modrinth:jade:xJQHCmWJ")
    compileOnly fg.deobf("vazkii.patchouli:Patchouli:1.20.1-84-FORGE")
    runtimeOnly fg.deobf("vazkii.patchouli:Patchouli:1.20.1-84-FORGE")

    implementation fg.deobf("curse.maven:irons-spells-n-spellbooks-855414:7402504")
    implementation fg.deobf("maven.modrinth:ars-nouveau:4.12.6-forge,1.20.1")
    implementation fg.deobf("maven.modrinth:goety:2.5.48.0-forge,1.20.1")
    implementation fg.deobf("maven.modrinth:l2library:2.5.3-forge,1.20.1")
    implementation fg.deobf("maven.modrinth:malum:1.20.1-1.6.7")
    implementation fg.deobf("maven.modrinth:lodestonelib:1.20.1-1.6.4.1")
    implementation fg.deobf("dev.shadowsoffire:Apotheosis:1.20.1-7.4.8")
    implementation fg.deobf("dev.shadowsoffire:ApothicAttributes:1.20.1-1.3.7")
    implementation fg.deobf("dev.shadowsoffire:Placebo:1.20.1-8.6.3")
    compileOnly("io.github.llamalad7:mixinextras-common:0.4.1")
    compileOnly annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1")
    runtimeOnly fg.deobf("io.github.llamalad7:mixinextras-forge:0.4.1")


    runtimeOnly fg.deobf("maven.modrinth:playeranimator:1.0.2-rc1+1.20-forge")
    runtimeOnly fg.deobf("maven.modrinth:caelus:3.2.0+1.20.1-forge")
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:4.8.1")

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'

}

tasks.named('processResources', ProcessResources).configure {

    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "MixinConfigs": "${mod_id}.mixins.json",
                "Specification-Title": mod_id,
                "Specification-Vendor": mod_authors,
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor": mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    if (!project.hasProperty('fullTest')) {
        exclude '**/TribulationRulesTest*'
        exclude '**/AscensionTreeScreenContractTest*'
        exclude '**/TestDummyDedicatedClassloadingTest*'
        exclude '**/VisualSourceGuardTest*'
        exclude '**/OwnershipSecurityContractRedTest*'
        exclude '**/LegacyEffectResourceTest*'
        exclude '**/LegacyPathCleanupTest*'
        exclude '**/SpellConfigurationRulesTest*'
    }
}

def appendModResourcesToLegacyClasspath = { File cpFile ->
    if (cpFile.exists()) {
        def toAdd = [project.file("build/resources/main").absolutePath,
                     project.file("build/classes/java/main").absolutePath]
        def lines = new HashSet<String>()
        cpFile.readLines('UTF-8').each { lines.add(it.trim()) }
        def modified = false
        toAdd.each { p ->
            if (!lines.contains(p)) {
                lines.add(p)
                modified = true
            }
        }
        if (modified) {
            cpFile.withWriter('UTF-8') { w -> lines.each { w.println(it) } }
            logger.lifecycle("Appended mod resource dirs to ${cpFile.name}")
        }
    }
}

afterEvaluate {
    ['runClient', 'runServer', 'runData', 'runGameTestServer'].each { runName ->
        tasks.matching { it.name == runName }.configureEach {
            doFirst {
                appendModResourcesToLegacyClasspath(project.file("build/classpath/${runName}_minecraftClasspath.txt"))
            }
        }
    }
    tasks.matching { it.name == 'runGameTestServer' }.configureEach {
        def startedAt = 0L
        doFirst {
            startedAt = System.currentTimeMillis()
        }
        doLast {
            def gameTestLog = project.file('run/logs/latest.log')
            if (!gameTestLog.isFile() || gameTestLog.lastModified() < startedAt) {
                throw new GradleException('GameTest server did not produce a fresh log.')
            }
            def completed = gameTestLog.getText('UTF-8') =~ /========= (\d+) GAME TESTS COMPLETE/
            if (!completed.find() || completed.group(1).toInteger() == 0) {
                throw new GradleException('GameTest server must complete at least one test; see run/logs/latest.log.')
            }
        }
    }
    tasks.matching { it.name == 'genIntellijRuns' }.configureEach {
        doLast {
            ['runClient', 'runServer', 'runData', 'runGameTestServer'].each { r ->
                appendModResourcesToLegacyClasspath(project.file("build/classpath/${r}_minecraftClasspath.txt"))
            }
        }
    }
}
